<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>テストページ</title>
  <style>
    /* 掲示板用のシンプルスタイル */
    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 2px solid #ccc;
    }
    .board-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 400px;
      margin-bottom: 20px;
    }
    .board-form input,
    .board-form textarea {
      padding: 8px;
      font-size: 14px;
    }
    .board-form textarea {
      height: 80px;
      resize: vertical;
    }
    .board-form button {
      padding: 8px 16px;
      cursor: pointer;
    }
    .post-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 500px;
    }
    .post-item {
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 4px;
      background: #f9f9f9;
    }
    .post-header {
      font-weight: bold;
      font-size: 14px;
      color: #333;
      margin-bottom: 4px;
    }
    .post-text {
      font-size: 14px;
      white-space: pre-wrap;
    }
    .post-date {
      font-size: 11px;
      color: #888;
      font-weight: normal;
      margin-left: 8px;
    }
  </style>

  <!-- Supabase JS SDK (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>おめでとうっ表示できた！🎉</h1>
  <p>HTMLが正常に動いています。</p>

  <!-- フッター領域 -->
  <footer>
    <h2>ご意見掲示板</h2>
    
    <!-- 投稿フォーム -->
    <form class="board-form" id="boardForm">
      <input type="text" id="nickname" placeholder="ニックネーム" required>
      <textarea id="comment" placeholder="ご意見を入力してください" required></textarea>
      <button type="submit" id="submitBtn">送信する</button>
    </form>

    <h3>これまでの書き込み</h3>
    <!-- 投稿一覧 -->
    <div class="post-list" id="postList"></div>
  </footer>

  <script>
    // Supabase の初期化設定
    const SUPABASE_URL = 'https://qudzriiphxhbihllhezn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_1d8nwHhBQHmqgd-fLZ8KMw_2ILSUb2W';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 投稿一覧を取得して表示する関数
    async function fetchAndRenderPosts() {
      const postList = document.getElementById("postList");
      postList.innerHTML = "<p>読み込み中...</p>";

      // Supabase から投稿一覧を取得（新しい順）
      const { data: posts, error } = await supabase
        .from('posts')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('取得エラー:', error);
        postList.innerHTML = "<p>データの取得に失敗しました。</p>";
        return;
      }

      if (!posts || posts.length === 0) {
        postList.innerHTML = "<p>まだ投稿がありません。</p>";
        return;
      }

      // HTML に描画
      postList.innerHTML = posts.map(post => {
        const date = new Date(post.created_at).toLocaleString('ja-JP');
        return `
          <div class="post-item">
            <div class="post-header">
              ${escapeHtml(post.name)}
              <span class="post-date">${date}</span>
            </div>
            <div class="post-text">${escapeHtml(post.text)}</div>
          </div>
        `;
      }).join("");
    }

    // エスケープ処理
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }

    // フォーム送信処理（Supabase に保存）
    document.getElementById("boardForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      
      const nameInput = document.getElementById("nickname");
      const textInput = document.getElementById("comment");
      const submitBtn = document.getElementById("submitBtn");
      
      const name = nameInput.value.trim();
      const text = textInput.value.trim();
      
      if (!name || !text) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "送信中...";

      // Supabase に新規投稿データを挿入
      const { error } = await supabase
        .from('posts')
        .insert([{ name, text }]);

      if (error) {
        console.error('送信エラー:', error);
        alert('投稿に失敗しました。');
      } else {
        // 成功したらフォームを空にして再描画
        nameInput.value = "";
        textInput.value = "";
        await fetchAndRenderPosts();
      }

      submitBtn.disabled = false;
      submitBtn.textContent = "送信する";
    });

    // 初期表示
    fetchAndRenderPosts();
  </script>
</body>
</html>
